name: Import verified LX Music Mobile 1.9.2 source

on:
  push:
    branches:
      - integration/musicx-experience-cache
    paths:
      - .github/workflows/import-lx-music.yml

permissions:
  contents: write

jobs:
  replace-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: integration/musicx-experience-cache
          fetch-depth: 0

      - name: Download verified upstream source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fL --retry 3 "https://codeload.github.com/lyswhut/lx-music-mobile/zip/0669d1b6d419967822ff52ec06e50b9613bfd136" -o "$tmp/source.zip"
          unzip -q "$tmp/source.zip" -d "$tmp"
          src="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -f "$src/package.json"
          test "$(node -p "require('$src/package.json').version")" = "1.9.2"
          rsync -a --delete --exclude='.git' "$src/" "$GITHUB_WORKSPACE/"

      - name: Commit complete source replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace MusicXLX with LX Music Mobile v1.9.2"
          git push origin HEAD:integration/musicx-experience-cache
