name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - integration/musicx-experience-cache

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Generate app icon
        run: |
          mkdir -p MusicXLX/Assets.xcassets/AppIcon.appiconset
          swift scripts/generate-app-icon.swift MusicXLX/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project MusicXLX.xcodeproj \
            -scheme MusicXLX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            build

      - name: Package app
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/MusicXLX.app build/Payload/
          cd build
          zip -r MusicXLX-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicXLX-unsigned-IPA
          path: build/MusicXLX-unsigned.ipa
          if-no-files-found: error
