name: iOS Simulator Build

on:
  push:
    branches:
      - integration/musicx-experience-cache
    paths:
      - "ios/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "react-native.config.js"
      - "babel.config.js"
      - "tsconfig.json"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches:
      - integration/musicx-experience-cache
    paths:
      - "ios/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "react-native.config.js"
      - "babel.config.js"
      - "tsconfig.json"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: integration/musicx-experience-cache

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: ESLint check
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Bundle JavaScript for iOS
        run: |
          mkdir -p "$RUNNER_TEMP/ios-assets"
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/main.jsbundle" \
            --assets-dest "$RUNNER_TEMP/ios-assets"

  build-ios:
    needs: validate-js
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: integration/musicx-experience-cache

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -workspace ios/LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
