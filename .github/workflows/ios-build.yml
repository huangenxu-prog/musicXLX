name: iOS Manual Build

on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Report production dependency vulnerabilities
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const fs = require("fs"); const a = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8")); console.log(JSON.stringify({ metadata: a.metadata?.vulnerabilities, vulnerabilities: Object.entries(a.vulnerabilities ?? {}).map(([name, v]) => ({ name, severity: v.severity, isDirect: v.isDirect, range: v.range, via: v.via, effects: v.effects, nodes: v.nodes, fixAvailable: v.fixAvailable })) }, null, 2))'

      - name: Validate iOS source runtime syntax
        run: node --check ios/LxMusicMobile/user-api-preload.js

      - name: Test source runtime UTF-8 and binary codecs
        run: node ios/LxMusicMobileTests/user-api-preload.test.cjs

      - name: Test source initialization, URL resolution, and network callback bridge
        run: node tests/user-api-bridge.test.cjs

      - name: ESLint check
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Bundle JavaScript for iOS
        run: |
          mkdir -p "$RUNNER_TEMP/ios-assets"
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/main.jsbundle" \
            --assets-dest "$RUNNER_TEMP/ios-assets"

  build-ios:
    needs: validate-js
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -workspace ios/LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Bundle and register iOS icon fonts (simulator)
        run: |
          set -euo pipefail
          for PLATFORM in iphonesimulator; do
            APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-${PLATFORM}/LxMusicMobile.app"
            test -d "$APP"
            FONT_DIR="node_modules/react-native-vector-icons/Fonts"
            test -d "$FONT_DIR"
            count=0
            while IFS= read -r -d '' FONT; do
              NAME="$(basename "$FONT")"
              ditto "$FONT" "$APP/$NAME"
              /usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "$APP/Info.plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :UIAppFonts:${count} string $NAME" "$APP/Info.plist"
              count=$((count + 1))
            done < <(find "$FONT_DIR" -maxdepth 1 -type f -name '*.ttf' -print0)
            test "$count" -gt 0
            CUSTOM_FONT="src/resources/fonts/icomoon.ttf"
            test -f "$CUSTOM_FONT"
            ditto "$CUSTOM_FONT" "$APP/icomoon.ttf"
            /usr/libexec/PlistBuddy -c "Add :UIAppFonts:${count} string icomoon.ttf" "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :UIAppFonts" "$APP/Info.plist"

            echo "Registered $count vector icon fonts for $PLATFORM"
          done

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: musicXLX-ios-simulator-${{ github.run_number }}
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphonesimulator/LxMusicMobile.app
          if-no-files-found: error
          retention-days: 7

      - name: Build iOS device app
        run: |
          xcodebuild \
            -workspace ios/LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Bundle and register iOS icon fonts (device)
        run: |
          set -euo pipefail
          for PLATFORM in iphoneos; do
            APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-${PLATFORM}/LxMusicMobile.app"
            test -d "$APP"
            FONT_DIR="node_modules/react-native-vector-icons/Fonts"
            test -d "$FONT_DIR"
            count=0
            while IFS= read -r -d '' FONT; do
              NAME="$(basename "$FONT")"
              ditto "$FONT" "$APP/$NAME"
              /usr/libexec/PlistBuddy -c "Add :UIAppFonts array" "$APP/Info.plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :UIAppFonts:${count} string $NAME" "$APP/Info.plist"
              count=$((count + 1))
            done < <(find "$FONT_DIR" -maxdepth 1 -type f -name '*.ttf' -print0)
            test "$count" -gt 0
            CUSTOM_FONT="src/resources/fonts/icomoon.ttf"
            test -f "$CUSTOM_FONT"
            ditto "$CUSTOM_FONT" "$APP/icomoon.ttf"
            /usr/libexec/PlistBuddy -c "Add :UIAppFonts:${count} string icomoon.ttf" "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :UIAppFonts" "$APP/Info.plist"

            echo "Registered $count vector icon fonts for $PLATFORM"
          done

      - name: Upload iOS device app
        uses: actions/upload-artifact@v4
        with:
          name: musicXLX-ios-device-${{ github.run_number }}
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/LxMusicMobile.app
          if-no-files-found: error
          retention-days: 7


      - name: Package unsigned iOS IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/LxMusicMobile.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/LxMusicMobile.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$RUNNER_TEMP/MusicXLX-unsigned.ipa" Payload
          unzip -t "$RUNNER_TEMP/MusicXLX-unsigned.ipa" | tail -n 1

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: musicXLX-unsigned-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/MusicXLX-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
